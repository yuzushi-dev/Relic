    - Data Model: architecture/data-model.md
    - Privacy Stages: architecture/privacy-stages.md
    - Artifact Lifecycle: architecture/artifact-lifecycle.md
    - Chronicle (Audit Ledger): architecture/chronicle.md
    - Security Model: architecture/security-model.md
    - Module Map: architecture/module-map.md
  - Guides:
    - Getting Started: guides/getting-started.md
    - Demo Quickstart: guides/demo-quickstart.md
    - Installation: guides/installation.md
    - First Subject: guides/first-subject.md
    - API Keys and Tokens: guides/api-keys-and-tokens.md
    - Delivery Channels: guides/delivery-channels.md
    - Hermes Integration: guides/hermes-integration.md
    - Researcher Workbench: guides/researcher-workbench.md
    - Multi-Researcher Setup: guides/multi-researcher.md
