site_name: Relic
site_description: Runtime governance and longitudinal modeling for reflective agents
site_url: https://yuzushi-dev.github.io/Relic/
repo_url: https://github.com/yuzushi-dev/Relic
repo_name: yuzushi-dev/Relic
docs_dir: public-docs
edit_uri: edit/main/public-docs/

theme:
  name: material
  palette:
    - scheme: slate
      primary: blue
      accent: blue
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - awesome-pages

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Ethics:
    - Overview: ethics/index.md
    - Behavioral Boundaries: ethics/boundaries.md
    - Data Stream Separation: ethics/data-streams-separation.md
    - Consent and Control: ethics/consent-and-control.md
    - Consent Template: ethics/consent-template.md
    - No Clinicalization: ethics/no-clinicalization.md
  - Concepts:
    - Longitudinal Modeling: concepts/longitudinal-modeling.md
    - Facet Model: concepts/facet-model.md
    - Relic and Gumi: concepts/relic-and-gumi.md
    - Provenance and Correction: concepts/provenance-and-correction.md
    - Researcher Boundary: concepts/researcher-boundary.md
    - Safety Signals: concepts/safety-signals.md
    - CAC Scoring: concepts/cac-scoring.md
  - Architecture:
