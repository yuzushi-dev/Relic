services:
  researcher-ui:
    build:
      context: .
      target: static-runner
    environment:
      PORT: "4143"
      RELIC_UI_DATA_SOURCE: demo
    ports:
      - "4143:4143"
    restart: unless-stopped

  researcher-ui-live:
    build:
      context: .
      target: runner
    environment:
      PORT: "4144"
      RELIC_UI_DATA_SOURCE: live
      RELIC_HOME: /data/relic
    ports:
      - "4144:4144"
    volumes:
      - ${RELIC_HOME:-./.relic-live}:/data/relic:ro
    restart: unless-stopped
