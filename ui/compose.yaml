services:
  researcher-ui:
    build:
      context: .
      target: static-runner
    environment:
      PORT: "4143"
      RELIC_UI_DATA_SOURCE: demo
    ports:
      - "4143:4143"
    restart: unless-stopped

  researcher-ui-live:
    build:
      context: .
      target: runner
    environment:
      PORT: "4144"
      RELIC_UI_DATA_SOURCE: live
      RELIC_HOME: /data/relic
      HERMES_PROFILES_HOME: /data/hermes/profiles
    ports:
      - "4144:4144"
    volumes:
      - ${RELIC_HOME:-$HOME/.relic}:/data/relic:ro
      - ${HERMES_PROFILES_HOME:-$HOME/.hermes/profiles}:/data/hermes/profiles:ro
    restart: unless-stopped
