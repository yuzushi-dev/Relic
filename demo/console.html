    <style>

            --panel-2: #1b1316;
            --border: #3c2226;
            --border-strong: #7d0f1c;
            --text: #f3ece8;
            --text-muted: #a69691;
            --red: #d72638;
            --red-soft: #ff5a6b;
            --gold: #c6a667;
            --green: #84d1a4;
            --ash: #d9cfca;
            --font: 'IBM Plex Sans', sans-serif;
            --head: 'Rajdhani', sans-serif;
            --mono: 'IBM Plex Mono', monospace;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse 80% 50% at 90% -10%, rgba(215, 38, 56, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse 60% 40% at 10% 50%, rgba(198, 166, 103, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse 100% 100% at 50% 100%, rgba(215, 38, 56, 0.05) 0%, transparent 40%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            border: 1px solid var(--gold);
            border-radius: 4px;
            padding: 14px;
            box-shadow: 
                inset 0 0 30px rgba(198, 166, 103, 0.05),
                0 0 60px rgba(215, 38, 56, 0.1),
                0 0 100px rgba(0, 0, 0, 0.5);
        }
        
        header {
            text-align: center;
            padding: 30px 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 30px;
        }
        
        header h1 {
            font-family: var(--head);
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--text);
            margin-bottom: 8px;
        }
        
        header h1 span {
            color: var(--red);
        }
        
        header .subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-family: var(--mono);
        }
        
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--surface);
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        
        .stat-chip {
            background: var(--panel);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 4px;
            text-align: center;
            min-width: 120px;
        }
        
        .stat-chip .value {
            font-family: var(--head);
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--gold);
        }
        
        .stat-chip .label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 4px;
        }
        
        .panels-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 1000px) {
            .panels-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .panel-header {
            background: var(--panel-2);
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .panel-header h2 {
            font-family: var(--head);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        
        .panel-content {
            padding: 16px;
            max-height: 350px;
            overflow-y: auto;
        }
        
        .panel-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .panel-content::-webkit-scrollbar-track {
            background: var(--surface);
        }
        
        .panel-content::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 3px;
        }
        
        .session-item {
            padding: 12px;
            background: var(--surface);
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 3px solid var(--border);
        }
        
        .session-item:last-child {
            margin-bottom: 0;
        }
        
        .session-item .session-id {
            font-family: var(--mono);
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 6px;
        }
        
        .session-item .session-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .badge-granted {
            background: rgba(132, 209, 164, 0.15);
            color: var(--green);
            border: 1px solid rgba(132, 209, 164, 0.3);
        }
        
        .badge-denied {
            background: rgba(215, 38, 56, 0.15);
            color: var(--red-soft);
            border: 1px solid rgba(215, 38, 56, 0.3);
        }
        
        .badge-pending {
            background: rgba(198, 166, 103, 0.15);
            color: var(--gold);
            border: 1px solid rgba(198, 166, 103, 0.3);
        }
        
        .badge-applied {
            background: rgba(132, 209, 164, 0.15);
            color: var(--green);
            border: 1px solid rgba(132, 209, 164, 0.3);
        }
        
        .badge-rejected {
            background: rgba(215, 38, 56, 0.15);
            color: var(--red-soft);
            border: 1px solid rgba(215, 38, 56, 0.3);
        }
        
        .badge-open {
            background: rgba(215, 38, 56, 0.15);
            color: var(--red-soft);
            border: 1px solid rgba(215, 38, 56, 0.3);
        }
        
        .badge-resolved {
            background: rgba(132, 209, 164, 0.15);
            color: var(--green);
            border: 1px solid rgba(132, 209, 164, 0.3);
        }
        
        .badge-low {
            background: rgba(198, 166, 103, 0.15);
            color: var(--gold);
            border: 1px solid rgba(198, 166, 103, 0.3);
        }
        
        .badge-medium {
            background: rgba(215, 38, 56, 0.15);
            color: var(--red-soft);
            border: 1px solid rgba(215, 38, 56, 0.3);
        }
        
        .correction-item {
            padding: 14px;
            background: var(--surface);
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 3px solid var(--gold);
        }
        
        .correction-item:last-child {
            margin-bottom: 0;
        }
        
        .correction-item .type {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--gold);
            margin-bottom: 6px;
        }
        
        .correction-item .delta {
            font-size: 0.85rem;
            color: var(--text);
            margin-bottom: 10px;
            line-height: 1.4;
        }
        
        .correction-item .source {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
        
        .correction-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn {
            font-family: var(--font);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 3px;
            border: 1px solid;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .btn-apply {
            background: rgba(132, 209, 164, 0.1);
            border-color: var(--green);
            color: var(--green);
        }
        
        .btn-apply:hover {
            background: rgba(132, 209, 164, 0.2);
        }
        
        .btn-reject {
            background: rgba(215, 38, 56, 0.1);
            border-color: var(--red);
            color: var(--red-soft);
        }
        
        .btn-reject:hover {
            background: rgba(215, 38, 56, 0.2);
        }

            padding: 14px;
            background: var(--surface);
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 3px solid var(--border);

        .incident-item:last-child {
            margin-bottom: 0;
        }
        
        .incident-item .incident-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;

            font-weight: 500;
            color: var(--text);

        .incident-item .incident-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            line-height: 1.4;
        }
        
        .artifact-section {
            margin-bottom: 30px;
        }

            font-family: var(--head);
            font-size: 1.2rem;
            font-weight: 600;

            text-transform: uppercase;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            color: var(--text);
        }
        
        .artifact-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        
        .artifact-table th,
        .artifact-table td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        .artifact-table th {
            background: var(--panel-2);
            font-family: var(--head);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }
        
        .artifact-table tr:last-child td {
            border-bottom: none;
        }
        
        .artifact-table tr:hover td {
            background: var(--surface);
        }
        
        .artifact-type {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--gold);
        }
        
        .artifact-session {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        
        .artifact-path {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--ash);
        }
        
        .artifact-hash {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        
        .audit-section {
            margin-bottom: 30px;
        }
        
        .audit-trail {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        
        .audit-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .audit-item:last-child {
            border-bottom: none;
        }
        
        .audit-item .audit-time {
            font-family: var(--mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 160px;
        }
        
        .audit-item .audit-type {
            font-family: var(--mono);
            font-size: 0.8rem;
            color: var(--gold);
            min-width: 140px;
        }
        
        .audit-item .audit-delta {
            flex: 1;
            font-size: 0.85rem;
            color: var(--text);
        }
        
        .audit-item .audit-source {
            font-size: 0.75rem;
            color: var(--text-muted);
            min-width: 80px;
        }
        
        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid var(--border);
            margin-top: 30px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        
        footer a {
            color: var(--gold);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
        
        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>

    function formatDate(isoString) {
        const date = new Date(isoString);
        return date.toLocaleDateString('en-US', { 
            month: 'short', 
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }

    function truncateHash(hash, length = 8) {
        return hash.substring(0, length);
    }

    function renderStats() {
        const stats = window.RELIC_DEMO_DATA.stats;
        const container = document.getElementById('stats-bar');
        
        container.innerHTML = `
            <div class="stat-chip">
                <div class="value">${stats.total_sessions}</div>
                <div class="label">Sessions</div>
            </div>
            <div class="stat-chip">
                <div class="value">${stats.total_prompts}</div>
                <div class="label">Prompts</div>
            </div>
            <div class="stat-chip">
                <div class="value">${stats.redacted_prompts}</div>
                <div class="label">Redacted</div>
            </div>
            <div class="stat-chip">
                <div class="value">${stats.corrections_applied}</div>
                <div class="label">Applied</div>
            </div>
            <div class="stat-chip">
                <div class="value">${stats.corrections_pending}</div>
                <div class="label">Pending</div>
            </div>
            <div class="stat-chip">
                <div class="value">${stats.open_incidents}</div>
                <div class="label">Open Incidents</div>
            </div>
        `;
    }

    function renderSessionLog() {
        const sessions = window.RELIC_DEMO_DATA.sessions;
        const consents = window.RELIC_DEMO_DATA.consent_records;
        const container = document.getElementById('session-log');
        
        if (sessions.length === 0) {
            container.innerHTML = '<div class="empty-state">No sessions recorded</div>';
            return;
        }
        
        container.innerHTML = sessions.map(session => {
            const sessionConsents = consents.filter(c => c.session_id === session.id);
            const allGranted = sessionConsents.length > 0 && sessionConsents.every(c => c.granted === 1);
            
            return `
                <div class="session-item">
                    <div class="session-id">${session.id}</div>
                    <div class="session-meta">
                        <span>${formatDate(session.created_at)}</span>
                        <span>${session.prompt_count} prompts</span>
                        <span>${session.redacted_count} redacted</span>
                        <span class="badge ${allGranted ? 'badge-granted' : 'badge-denied'}">
                            ${allGranted ? 'Consent Granted' : 'No Consent'}
                        </span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderReviewQueue() {
        const corrections = window.RELIC_DEMO_DATA.correction_records.filter(c => c.applied === 0);
        const container = document.getElementById('review-queue');
        
        if (corrections.length === 0) {
            container.innerHTML = '<div class="empty-state">No pending corrections</div>';
            return;
        }
        
        container.innerHTML = corrections.map(corr => `
            <div class="correction-item">
                <div class="type">${corr.correction_type.replace('_', ' ')}</div>
                <div class="delta">${corr.delta_content}</div>
                <div class="source">Source: ${corr.source}</div>
                <div class="correction-actions">
                    <button class="btn btn-apply" onclick="this.textContent='Applied'; this.disabled=true;">Apply</button>
                    <button class="btn btn-reject" onclick="this.textContent='Rejected'; this.disabled=true;">Reject</button>
                </div>
            </div>
        `).join('');
    }

    function renderIncidentReports() {
        const incidents = window.RELIC_DEMO_DATA.incident_reports;
        const container = document.getElementById('incident-reports');
        
        if (incidents.length === 0) {
            container.innerHTML = '<div class="empty-state">No incidents reported</div>';
            return;
        }
        
        container.innerHTML = incidents.map(inc => `
            <div class="incident-item">
                <div class="incident-header">
                    <span class="badge badge-${inc.severity}">${inc.severity}</span>
                    <span class="badge badge-${inc.status}">${inc.status}</span>
                </div>
                <div class="incident-title">${inc.title}</div>
                <div class="incident-desc">${inc.description}</div>
            </div>
        `).join('');
    }

    function renderArtifactRegistry() {
        const artifacts = window.RELIC_DEMO_DATA.artifact_records;
        const tbody = document.getElementById('artifact-tbody');
        
        if (artifacts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">No artifacts registered</td></tr>';
            return;
        }
        
        tbody.innerHTML = artifacts.map(art => `
            <tr>
                <td class="artifact-type">${art.artifact_type}</td>
                <td class="artifact-session">${art.session_id}</td>
                <td class="artifact-path">${art.lineage_path}</td>
                <td class="artifact-hash">${truncateHash(art.artifact_hash)}</td>
            </tr>
        `).join('');
    }

    function renderAuditTrail() {
        const corrections = window.RELIC_DEMO_DATA.correction_records.sort((a, b) => 
            new Date(a.created_at) - new Date(b.created_at)
        );
        const container = document.getElementById('audit-trail');
        
        if (corrections.length === 0) {
            container.innerHTML = '<div class="empty-state">No audit records</div>';
            return;
        }
        
        container.innerHTML = corrections.map(corr => `
            <div class="audit-item">
                <span class="audit-time">${formatDate(corr.created_at)}</span>
                <span class="audit-type">${corr.correction_type.replace('_', ' ')}</span>
                <span class="audit-delta">${corr.delta_content}</span>
                <span class="badge ${corr.applied ? 'badge-applied' : 'badge-rejected'}">${corr.applied ? 'Applied' : 'Pending'}</span>
                <span class="audit-source">${corr.source}</span>
            </div>
        `).join('');
    }

    document.addEventListener('DOMContentLoaded', function() {
        renderStats();
        renderSessionLog();
        renderReviewQueue();
        renderIncidentReports();
        renderArtifactRegistry();
        renderAuditTrail();
    });
    </script>
