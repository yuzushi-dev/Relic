name: Deploy Demo UI to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static demo
        run: npm run build:static
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Add legacy demo console
        run: |
          mkdir -p out/demo
          cp ../demo/console.html out/demo/console.html
          cp -R ../demo/generated out/demo/generated
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=demo/console.html">' \
            '<title>Relic Demo</title>' \
            '<a href="demo/console.html">Open Relic demo</a>' \
            > out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
