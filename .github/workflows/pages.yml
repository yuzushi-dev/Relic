name: Deploy Demo UI to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build static demo
        run: RELIC_UI_BASE_PATH=/Relic npm run build:static
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - name: Publish current researcher UI entrypoints
        run: |
          publish_root=out
          if [ -d out/Relic ]; then
            publish_root=out/Relic
          fi
          mkdir -p "$publish_root/demo"
          cp -R ../demo/generated "$publish_root/demo/generated"
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=dashboard/">' \
            '<title>Relic Researcher Workbench</title>' \
            '<a href="dashboard/">Open Relic Researcher Workbench</a>' \
            > "$publish_root/index.html"
          printf '%s\n' \
            '<!doctype html>' \
            '<meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=../dashboard/">' \
            '<title>Relic Researcher Workbench</title>' \
            '<a href="../dashboard/">Open Relic Researcher Workbench</a>' \
            > "$publish_root/demo/console.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
