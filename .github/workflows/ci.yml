name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          python -m pip install -e .
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Validate JSON and JSONL fixtures
        run: python scripts/ci/check_json_jsonl.py
      - name: Check no raw private data markers
        run: python scripts/ci/check_no_raw_private_data.py
      - name: Checkin naturalness metrics
        run: |
          python -m pytest \
            tests/checkin/test_metrics.py \
            tests/checkin/test_policy_scenarios.py \
            tests/gumi_plugin/test_decision_log_canonical.py \
            -q
      - name: Evaluation, docs, and defensibility-gate contracts
        # Guards the scientific-claim surface (gate 1/7-default and 3/7-committed,
        # replication-bundle contract, docs contracts, correction-propagation FK
        # integrity) that `make test` does not cover.
        run: python -m pytest tests/eval tests/docs tests/memory_dynamics tests/correction -q

env:
  RELIC_ENV: ci
  RELIC_NO_NETWORK: '1'
  RELIC_USE_FIXTURES: '1'
  PYTHONPATH: '.'
